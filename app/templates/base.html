<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AI Marketing Assistant{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
  {% block head %}{% endblock %}
</head>
<body>

<div class="d-flex min-vh-100" id="app-wrapper">

  <!-- ── Sidebar ─────────────────────────────────────────────────────── -->
  <nav id="sidebar" class="sidebar d-flex flex-column flex-shrink-0">
    <!-- Brand -->
    <a href="/dashboard" class="sidebar-brand d-flex align-items-center gap-2 text-white text-decoration-none">
      <i class="bi bi-robot fs-4"></i>
      <span class="fw-bold fs-5">AI Marketing</span>
    </a>

    <hr class="sidebar-divider" />

    <!-- Navigation -->
    <ul class="nav nav-pills flex-column gap-1 flex-grow-1">
      {% block sidebar_nav %}{% endblock %}
    </ul>

    <hr class="sidebar-divider" />

    <!-- User menu -->
    <div class="dropdown">
      <a href="#" class="sidebar-user d-flex align-items-center gap-2 text-white text-decoration-none"
         data-bs-toggle="dropdown" aria-expanded="false">
        <div class="sidebar-avatar">{{ user.name[0]|upper }}</div>
        <div class="overflow-hidden">
          <div class="fw-semibold text-truncate small">{{ user.name }}</div>
          <div class="text-white-50 text-truncate" style="font-size:.7rem">{{ user.email }}</div>
        </div>
        <i class="bi bi-chevron-up ms-auto"></i>
      </a>
      <ul class="dropdown-menu dropdown-menu-dark">
        <li>
          <a class="dropdown-item" href="/logout">
            <i class="bi bi-box-arrow-right me-2"></i>Sign out
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- ── Main content ───────────────────────────────────────────────── -->
  <div class="flex-grow-1 d-flex flex-column overflow-hidden" id="main-content">

    <!-- Top bar -->
    <header class="topbar d-flex align-items-center px-4 gap-3">
      <button class="btn btn-icon" id="sidebarToggle" title="Toggle sidebar">
        <i class="bi bi-list fs-5"></i>
      </button>
      <h6 class="mb-0 fw-semibold text-truncate">{% block page_title %}Dashboard{% endblock %}</h6>
      <div class="ms-auto d-flex align-items-center gap-2">
        <button class="btn btn-icon" id="themeToggle" title="Toggle dark mode">
          <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
        </button>
        <a href="/chat/" class="btn btn-sm btn-primary d-flex align-items-center gap-1">
          <i class="bi bi-chat-dots-fill"></i>
          <span class="d-none d-sm-inline">Chat with AI</span>
        </a>
      </div>
    </header>

    <!-- Page body -->
    <main class="flex-grow-1 overflow-auto p-4">
      {% block content %}{% endblock %}
    </main>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/main.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
