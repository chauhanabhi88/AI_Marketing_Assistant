<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — AI Marketing Assistant</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="auth-body">

<div class="auth-container">

  <div class="text-center mb-4">
    <div class="auth-logo mx-auto mb-3">
      <i class="bi bi-robot fs-1 text-primary"></i>
    </div>
    <h4 class="fw-bold">Create Company Account</h4>
    <p class="text-muted small">Get started with AI-powered marketing</p>
  </div>

  {% if error %}
  <div class="alert alert-danger d-flex align-items-center gap-2" role="alert">
    <i class="bi bi-exclamation-triangle-fill"></i>
    {{ error }}
  </div>
  {% endif %}

  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <form method="post" action="/register">

        <div class="row g-3 mb-3">
          <div class="col-12">
            <label class="form-label fw-semibold small" for="name">Full Name</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="name" name="name"
                     placeholder="John Doe" required />
            </div>
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold small" for="company_name">Company Name</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-building"></i></span>
              <input type="text" class="form-control" id="company_name" name="company_name"
                     placeholder="Acme Corp" required />
            </div>
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold small" for="email">Work Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="email" name="email"
                     placeholder="you@company.com" required />
            </div>
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold small" for="password">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" name="password"
                     placeholder="Min. 8 characters" required minlength="8" />
              <button class="btn btn-outline-secondary" type="button" id="togglePwd">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
          <i class="bi bi-person-plus-fill me-1"></i>Create Account
        </button>
      </form>
    </div>
  </div>

  <p class="text-center mt-3 small text-muted">
    Already have an account?
    <a href="/login" class="fw-semibold text-decoration-none">Sign in</a>
  </p>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/main.js"></script>
<script>
  document.getElementById('togglePwd').addEventListener('click', function () {
    const pwd = document.getElementById('password');
    const icon = this.querySelector('i');
    pwd.type = pwd.type === 'password' ? 'text' : 'password';
    icon.className = pwd.type === 'text' ? 'bi bi-eye-slash' : 'bi bi-eye';
  });
</script>
</body>
</html>
